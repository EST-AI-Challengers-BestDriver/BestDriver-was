spring:
  application:
    name: bestdriver-was
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bestdriver}
    username: ${SPRING_DATASOURCE_USERNAME:bestdriver}
    password: ${SPRING_DATASOURCE_PASSWORD:bestdriver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

bestdriver:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  prediction:
    mode: ${PREDICTION_MODE:mock}
