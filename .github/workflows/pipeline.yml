name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: was-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress verify

  publish:
    name: Build and publish image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    if: github.event_name != 'pull_request' && vars.EC2_CD_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      WAS_IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
      WAS_HOST_PORT: ${{ vars.WAS_HOST_PORT || '8080' }}

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::020212777377:role/BestDriver-GitHub-Deploy
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Deploy WAS service via SSM
        shell: bash
        env:
          INSTANCE_ID: i-03ce10656dbb5142a
        run: |
          # Compose 파일을 SSM 명령에 안전하게 포함시키기 위해 base64 변환
          COMPOSE_B64="$(base64 -w 0 deploy/compose.yml)"

          # EC2에서 실행할 배포 스크립트
          REMOTE_SCRIPT="$(cat <<EOF
          set -eu

          install -d -m 755 -o ubuntu -g ubuntu /home/ubuntu/bestdriver

          printf '%s' '$COMPOSE_B64' \
            | base64 -d \
            > /home/ubuntu/bestdriver/was.compose.yml

          cat > /home/ubuntu/bestdriver/was.deploy.env <<ENVEOF
          WAS_IMAGE=$WAS_IMAGE
          WAS_HOST_PORT=$WAS_HOST_PORT
          ENVEOF

          chown ubuntu:ubuntu \
            /home/ubuntu/bestdriver/was.compose.yml \
            /home/ubuntu/bestdriver/was.deploy.env

          # DB 접속정보가 담긴 기존 파일은 절대 덮어쓰지 않고 존재 여부만 확인
          if [ ! -f /home/ubuntu/bestdriver/was.runtime.env ]; then
            echo "ERROR: /home/ubuntu/bestdriver/was.runtime.env does not exist"
            exit 1
          fi

          docker network inspect bestdriver >/dev/null 2>&1 \
            || docker network create bestdriver

          cd /home/ubuntu/bestdriver

          docker compose \
            --env-file was.deploy.env \
            -p bestdriver-was \
            -f was.compose.yml \
            up -d \
            --pull always \
            --wait \
            --wait-timeout 120
          EOF
          )"

          SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)"

          jq -n \
            --arg cmd "printf '%s' '$SCRIPT_B64' | base64 -d | bash" \
            '{commands: [$cmd]}' \
            > ssm-params.json

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters file://ssm-params.json \
              --comment "BestDriver WAS deployment ${GITHUB_SHA}" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          then
            echo "Deployment succeeded."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          else
            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json || true

            exit 1
          fi
