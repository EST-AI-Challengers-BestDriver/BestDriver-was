services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: was.runtime.env
        required: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      bestdriver:
        aliases: [postgres]

  was:
    image: ${WAS_IMAGE:?WAS_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAS_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - path: was.runtime.env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      bestdriver:
        aliases: [was]

volumes:
  postgres-data:

networks:
  bestdriver:
    name: bestdriver
    external: true
